[project]
name = "stock-analysis-tool"
dynamic = ["version"]
description = "Research-focused stock analysis and backtesting toolkit."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.1.0",
    "pandas>=2.2.0",
    "pypdf>=6.16.1,<7",
    "streamlit>=1.36.0",
    "yfinance>=0.2.40",
]

[project.scripts]
stock-tool = "stock_tool.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pyinstaller>=6.0.0",
    "ruff>=0.5.0",
    "black>=24.0.0",
    "mypy>=1.10.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["stock_tool"]

[tool.coverage.report]
fail_under = 78.50
precision = 2
show_missing = true
skip_empty = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
target-version = ["py311"]

[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = {attr = "stock_tool.__version__"}
